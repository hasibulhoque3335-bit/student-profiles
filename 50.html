<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>হাসিবুল হক — ডিজিটাল বিজনেস কার্ড</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --dark-blue:#0a2f4f;
    --blue:#0f4c75;
    --light-blue:#3282b8;
    --gold:#c8a84e;
    --gold-dark:#96751d;
    --white:#ffffff;
    --gray:#f0f4f8;
    --text:#1a1a1a;
}

body{
    font-family:'Noto Sans Bengali','Poppins',sans-serif;
    background:linear-gradient(135deg,#0a2f4f 0%,#0f4c75 100%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px 10px;
}

.card{
    width:100%;
    max-width:380px;
    background:var(--white);
    border-radius:0;
    overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,.4);
    position:relative;
}

/* =====================================================
   TOP SECTION - DARK BLUE WITH CURVE
===================================================== */
.top-section{
    background:linear-gradient(135deg,var(--dark-blue) 0%,var(--blue) 100%);
    padding:35px 25px 80px;
    position:relative;
    clip-path:ellipse(150% 100% at 50% 0%);
}

.top-section::before{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    background:radial-gradient(circle,rgba(50,130,184,.15),transparent);
    border-radius:50%;
    top:-150px;
    right:-100px;
}

.islamic-pattern{
    position:absolute;
    top:20px;
    left:20px;
    width:60px;
    height:60px;
    opacity:0.1;
    background-image:url("data:image/svg+xml,[STRIPPED]);
}

.year-badge{
    display:inline-block;
    padding:5px 14px;
    background:rgba(200,168,78,.15);
    border:1px solid rgba(200,168,78,.4);
    border-radius:20px;
    color:var(--gold);
    font-size:9px;
    font-weight:700;
    margin-bottom:15px;
}

.photo-wrapper{
    width:120px;
    height:120px;
    margin:0 auto;
    position:relative;
    z-index:10;
}

.photo-circle{
    width:100%;
    height:100%;
    border-radius:50%;
    padding:4px;
    background:linear-gradient(135deg,var(--gold),var(--gold-dark));
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.photo-inner{
    width:100%;
    height:100%;
    border-radius:50%;
    background:var(--white);
    padding:3px;
}

.photo-inner img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
}

/* =====================================================
   NAME SECTION
===================================================== */
.name-section{
    text-align:center;
    padding:50px 25px 20px;
    background:var(--white);
    margin-top:-40px;
}

.name{
    font-size:32px;
    font-weight:900;
    color:var(--gold-dark);
    line-height:1.2;
    margin-bottom:5px;
    font-family:'Poppins','Noto Sans Bengali',sans-serif;
}

.title{
    font-size:12px;
    font-weight:700;
    color:var(--blue);
    letter-spacing:2px;
    text-transform:uppercase;
}

.father-name{
    margin-top:8px;
    font-size:13px;
    color:#666;
    font-weight:500;
}

/* =====================================================
   DIAGONAL SOCIAL ICONS
===================================================== */
.social-diagonal{
    position:relative;
    padding:30px 25px 40px;
    background:linear-gradient(135deg,var(--gray) 0%,#e8f1f8 100%);
    clip-path:polygon(0 0, 100% 15%, 100% 100%, 0 100%);
    margin-top:-10px;
}

.diagonal-icons{
    display:flex;
    flex-direction:column;
    gap:12px;
    align-items:flex-end;
    padding-top:20px;
}

.social-btn{
    width:50px;
    height:50px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:var(--white);
    font-size:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    transition:all.3s;
    position:relative;
}

.social-btn:hover{
    transform:translateX(-8px) scale(1.1);
}

.social-btn:nth-child(1){margin-right:0px;}
.social-btn:nth-child(2){margin-right:35px;}
.social-btn:nth-child(3){margin-right:70px;}
.social-btn:nth-child(4){margin-right:105px;}
.social-btn:nth-child(5){margin-right:140px;}
.social-btn:nth-child(6){margin-right:175px;}

.btn-phone{background:linear-gradient(135deg,#0a2f4f,#0f4c75);}
.btn-whatsapp{background:linear-gradient(135deg,var(--gold),var(--gold-dark));}
.btn-email{background:linear-gradient(135deg,#ea4335,#c5221f);}
.btn-facebook{background:linear-gradient(135deg,#1877f2,#0866df);}
.btn-instagram{background:linear-gradient(135deg,#833ab4,#fd1d1d 50%,#fcb045);}
.btn-telegram{background:linear-gradient(135deg,#229ed9,#168dcc);}

/* =====================================================
   INFO SECTION
===================================================== */
.info-section{
    background:linear-gradient(135deg,var(--blue) 0%,var(--dark-blue) 100%);
    padding:25px 25px 30px;
    color:var(--white);
    clip-path:polygon(0 15%, 100% 0, 100% 100%, 0 100%);
    margin-top:-20px;
}

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:30px;
}

.info-item{
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.5px;
}

.info-item strong{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-top:3px;
    color:var(--gold);
}

/* =====================================================
   QR SECTION
===================================================== */
.qr-section{
    background:var(--white);
    padding:25px;
    text-align:center;
}

.qr-title{
    font-size:11px;
    font-weight:800;
    color:var(--blue);
    margin-bottom:15px;
    text-transform:uppercase;
    letter-spacing:1px;
}

#qrcode{
    display:inline-block;
    padding:12px;
    background:var(--white);
    border:3px solid var(--gold);
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,.1);
}

#qrcode img{
    display:block;
}

.vcard-btn{
    margin-top:15px;
    width:100%;
    padding:14px;
    background:linear-gradient(135deg,var(--gold),var(--gold-dark));
    color:var(--white);
    border:none;
    border-radius:10px;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
    font-family:'Noto Sans Bengali',sans-serif;
    box-shadow:0 5px 15px rgba(200,168,78,.4);
    transition:.3s;
}

.vcard-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(200,168,78,.5);
}

.vcard-btn i{
    margin-right:8px;
}

/* =====================================================
   FOOTER
===================================================== */
.footer{
    background:var(--dark-blue);
    padding:15px;
    text-align:center;
    color:var(--gold);
    font-size:9px;
    font-weight:700;
    letter-spacing:1px;
}

/* =====================================================
   MOBILE
===================================================== */
@media(max-width:400px){
   .name{font-size:28px;}
   .social-btn{width:45px;height:45px;font-size:18px;}
   .social-btn:nth-child(2){margin-right:30px;}
   .social-btn:nth-child(3){margin-right:60px;}
   .social-btn:nth-child(4){margin-right:90px;}
   .social-btn:nth-child(5){margin-right:120px;}
   .social-btn:nth-child(6){margin-right:150px;}
}
</style>
</head>
<body>
<div class="card">
    <!-- TOP SECTION -->

        <div class="photo-wrapper">
            <div class="photo-circle">
                <div class="photo-inner">
                    <img src="https://lh3.googleusercontent.com/d/1i9Ex_eTx7FBJigLIfXMNPriR3GUjYpsY" alt="হাসিবুল হক">
                </div>
            </div>
        </div>
    </div>

    <!-- NAME SECTION -->
    <div class="name-section">
        <div class="name">হাসিবুল হক</div>
        <div class="title">তাকমীল ফিল হাদিস</div>
        <div class="father-name">পিতা: মুবিনুল হক</div>
    </div>

    <!-- DIAGONAL SOCIAL ICONS -->
    <div class="social-diagonal">
        <div class="diagonal-icons">
            <a href="tel:01930216833" class="social-btn btn-phone" aria-label="Call">
                <i class="fa-solid fa-phone"></i>
            </a>
            <a href="https://wa.me/8801930216833" target="_blank" class="social-btn btn-whatsapp" aria-label="WhatsApp">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
            <a href="mailto:hasibulhoque3335@gmail.com" class="social-btn btn-email" aria-label="Email">
                <i class="fa-solid fa-envelope"></i>
            </a>
            <a href="https://www.facebook.com/hasibulhoque3335" target="_blank" class="social-btn btn-facebook" aria-label="Facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="https://www.instagram.com/hasibulhoque3335" target="_blank" class="social-btn btn-instagram" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://t.me/hasibulhoque3335" target="_blank" class="social-btn btn-telegram" aria-label="Telegram">
                <i class="fa-brands fa-telegram"></i>
            </a>
        </div>
    </div>

    <!-- INFO SECTION -->
    <div class="info-section">
        <div class="info-grid">
            <div class="info-item">
                গ্রাম<strong>নদ্দাপাড়া</strong>
            </div>
            <div class="info-item">
                থানা<strong>দক্ষিণখান</strong>

            <div class="info-item">

    <!-- QR SECTION -->
    <div class="qr-section">
        <div class="qr-title">
            <i class="fa-solid fa-qrcode"></i> স্ক্যান করে কন্টাক্ট সেভ করুন
        </div>
        <div id="qrcode"></div>
        <button class="vcard-btn" id="downloadVCard">
            <i class="fa-solid fa-download"></i> vCard ডাউনলোড করুন
        </button>

    <!-- FOOTER -->
    <div class="footer">
        ক্রমিক নং ৫০ • DIGITAL ID CARD
    </div>

<script>
// vCard ডাটা
const vCardData = `BEGIN:VCARD
VERSION:3.0
FN:হাসিবুল হক
N:হক;হাসিবুল;;;
ORG:তাকমীল ফিল হাদিস
TITLE:সমাপনী শিক্ষার্থী
TEL;TYPE=CELL:01930216833
EMAIL:hasibulhoque3335@gmail.com
ADR;TYPE=HOME:;;নদ্দাপাড়া;দক্ষিণখান;ঢাকা;;বাংলাদেশ
URL:https://www.facebook.com/hasibulhoque3335
NOTE:রক্তের গ্রুপ: O+ | পিতা: মুবিনুল হক
END:VCARD`;

// QR কোড জেনারেট
new QRCode(document.getElementById("qrcode"), {
    text: vCardData,
    width: 140,
    height: 140,
    colorDark: "#0a2f4f",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
});

// vCard ডাউনলোড
document.getElementById('downloadVCard').addEventListener('click', function() {
    const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'hasibul_hoque.vcf';
    document.body.appendChild(a);
    a.click();
    window.URL.revokeObjectURL(url);
    document.body.removeChild(a);
});
</script>
</body>
</html>
