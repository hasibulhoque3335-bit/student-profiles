<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মোহাম্মাদ যায়েদ — শিক্ষার্থী পরিচিতি</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Noto Sans Bengali', sans-serif;
    background: linear-gradient(160deg, #0f3d2e 0%, #16543f 45%, #1c6b50 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 14px;
  }
  .card {
    background: #fffdf7;
    max-width: 420px;
    width: 100%;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 45px rgba(0,0,0,0.35);
  }
  .banner {
    background: #0f3d2e;
    color: #f2e6c9;
    text-align: center;
    padding: 14px 12px;
    font-size: 12.5px;
    line-height: 1.5;
    border-bottom: 3px solid #c9a227;
  }
  .photo-wrap {
    display: flex;
    justify-content: center;
    margin-top: -2px;
    background: #0f3d2e;
    padding-bottom: 22px;
  }
  .photo {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #c9a227;
    background: #eee;
  }
  .name-block {
    text-align: center;
    padding: 18px 16px 4px;
  }
  .name {
    font-size: 22px;
    font-weight: 700;
    color: #16543f;
    margin: 0;
  }
  .father {
    font-size: 14px;
    color: #666;
    margin-top: 4px;
  }
  .info {
    padding: 14px 22px 24px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #eee2c6;
    font-size: 15px;
  }
  .row:last-child { border-bottom: none; }
  .label {
    color: #8a7a3f;
    font-weight: 600;
    white-space: nowrap;
  }
  .value {
    text-align: right;
    color: #222;
    word-break: break-word;
  }
  .blood {
    display: inline-block;
    background: #b1191c;
    color: #fff;
    font-weight: 700;
    padding: 2px 12px;
    border-radius: 20px;
    font-size: 14px;
  }
  .links {
    display: flex;
    gap: 10px;
    padding: 0 22px 22px;
  }
  .btn {
    flex: 1;
    text-align: center;
    padding: 11px 8px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }
  .btn.call { background: #16543f; color: #fff; }
  .btn.fb { background: #1877f2; color: #fff; }
  .btn.mail { background: #c9a227; color: #fff; }
  .footer {
    text-align: center;
    font-size: 11px;
    color: #999;
    padding: 0 16px 18px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="banner">১৪৪৭-৪৮ হিজরী ২০২৬-২০২৭ শিক্ষাবর্ষ — তাকমীল ফিল হাদিস সমাপনী শিক্ষার্থীবৃন্দ</div>
    <div class="photo-wrap">
      <img class="photo" src="https://lh3.googleusercontent.com/d/1i9Ex_eTx7FBJigLIfXMNPriR3GUjYpsY" alt="মোহাম্মাদ যায়েদ">
    </div>
    <div class="name-block">
      <p class="name">মোহাম্মাদ যায়েদ</p>
      <div class="father">পিতা: মাওলানা আনোয়ার হোসাইন</div>
    </div>
    <div class="info">
      <div class="row"><span class="label">গ্রাম</span><span class="value">ভবানী জীবনপুর</span></div>
      <div class="row"><span class="label">থানা</span><span class="value">বেগমগঞ্জ</span></div>
      <div class="row"><span class="label">জেলা</span><span class="value">নোয়াখালী</span></div>
      <div class="row"><span class="label">রক্তের গ্রুপ</span><span class="value"><span class="blood">—</span></span></div>
      <div class="row"><span class="label">ফোন</span><span class="value">01603840809</span></div>
      <div class="row"><span class="label">জিমেইল</span><span class="value">—</span></div>
    </div>
    <div class="links">
      <a class="btn call" href="tel:01603840809">📞 কল</a>
      <a class="btn fb" href="https://www.facebook.com/hasibulhoque3335" target="_blank">Facebook</a>
    </div>
    <div class="footer">ক্রমিক নং 05 • ID Card QR Directory</div>
  </div>
</body>
</html>
