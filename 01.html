<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>হোসাইন আহমাদ — শিক্ষার্থী পরিচিতি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Hind Siliguri', sans-serif;
    background: radial-gradient(circle at top, #1b6b52 0%, #0c3a2b 60%, #071f17 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 14px;
  }
  .card {
    position: relative;
    background: #fffdf6;
    max-width: 420px;
    width: 100%;
    border-radius: 26px;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,0.45);
  }
  .banner {
    background: linear-gradient(135deg, #0c3a2b, #1b6b52);
    color: #f4e8c8;
    text-align: center;
    padding: 16px 18px 14px;
    font-size: 12px;
    line-height: 1.6;
    font-weight: 500;
    letter-spacing: 0.2px;
  }
  .banner::after {
    content: "";
    display: block;
    width: 60px;
    height: 3px;
    background: #d4af37;
    margin: 10px auto 0;
    border-radius: 3px;
  }
  .photo-wrap {
    display: flex;
    justify-content: center;
    background: linear-gradient(135deg, #0c3a2b, #1b6b52);
    padding-bottom: 30px;
    padding-top: 4px;
  }
  .photo-ring {
    width: 138px;
    height: 138px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg, #d4af37, #f4e08a, #d4af37);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
  .photo {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: contain;
    display: block;
    border: 3px solid #fffdf6;
    background: #fffdf6;
  }
  .name-block {
    text-align: center;
    padding: 20px 16px 6px;
  }
  .name {
    font-family: 'Baloo Da 2', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: #0c3a2b;
    margin: 0;
  }
  .father {
    font-size: 14px;
    color: #8a8a8a;
    margin-top: 5px;
    font-weight: 500;
  }
  .info {
    padding: 12px 24px 20px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px dashed #e7dcb8;
    font-size: 15px;
  }
  .row:last-child { border-bottom: none; }
  .label {
    color: #a68a2e;
    font-weight: 600;
    white-space: nowrap;
  }
  .value {
    text-align: right;
    color: #232323;
    font-weight: 500;
    word-break: break-word;
  }
  .blood {
    display: inline-block;
    background: linear-gradient(135deg, #c0392b, #922b21);
    color: #fff;
    font-weight: 700;
    padding: 3px 14px;
    border-radius: 20px;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 4px 24px 26px;
  }
  .btn {
    flex: 1 1 45%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 8px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    color: #fff;
    transition: transform .15s ease;
  }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn.call { background: linear-gradient(135deg, #1b6b52, #0c3a2b); }
  .btn.wa   { background: linear-gradient(135deg, #25D366, #128C4A); }
  .btn.fb   { background: linear-gradient(135deg, #4c8ef2, #1877f2); }
  .btn.mail { background: linear-gradient(135deg, #d4af37, #a9821f); }
  .footer {
    text-align: center;
    font-size: 10.5px;
    color: #b9b9b9;
    padding: 0 16px 20px;
    letter-spacing: 0.3px;
  }
</style>
</head>
