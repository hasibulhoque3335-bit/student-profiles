    content: "";

    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);

    opacity: 0.5;

  .photo-ring {

  .badge {

  .name {

    font-size: 25px;
    font-weight: 700;
    color: #ffffff;
    margin: 0 0 18px;
  }
  .icon-row {
    position: relative;
    display: flex;
    justify-content: center;
    gap: 14px;
  }
  .icon-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    backdrop-filter: blur(4px);

  .icon-btn.mail { background: rgba(212,175,55,0.18); border-color: rgba(212,175,55,0.4); }

  .sheet {

    margin: -18px 14px 0;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    position: relative;

  .item {

  .item-icon {

    height: 40px;
